version: 2
updates:
  # Weekly, grouped into one PR so it's a single thing to check.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # Big version jumps (Prisma 7, TypeScript 7…) can break things, so they're
    # planned as stories instead. Security fixes still arrive regardless.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
