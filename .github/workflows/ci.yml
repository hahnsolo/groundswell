name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Also runs `prisma generate` (postinstall). No database is needed for these checks.
      - run: npm ci
      # Route types (PageProps, LayoutProps) that tsc needs; `next dev` makes them locally.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
